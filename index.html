<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VAULT">
  <link rel="manifest" href="manifest.webmanifest">
  <title>VAULT</title>
  <style>
    :root{
      --bg:#f3f4f7;--card:#fff;--text:#111;--muted:#8b8b93;--line:#e5e6ea;
      --chip:#eff0f3;--good:#17823d;--bad:#c83a31;--warn:#a56a00;
      --shadow:0 9px 26px rgba(0,0,0,.06)
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
    body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 28px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 18px}
    h1{font-size:38px;line-height:1;margin:0;font-weight:900;letter-spacing:.06em}
    .iconbtn{border:0;background:var(--card);width:48px;height:48px;border-radius:50%;font-size:29px;box-shadow:var(--shadow)}
    .summary{background:linear-gradient(135deg,#111,#303036);color:white;border-radius:28px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px}
    .summary .label{opacity:.7;font-size:14px}
    .summary .value{font-size:36px;font-weight:850;letter-spacing:-.04em;margin:5px 0 12px}
    .summary .sub{display:flex;gap:9px;flex-wrap:wrap;font-size:13px;opacity:.9}
    .chip{background:rgba(255,255,255,.12);padding:7px 10px;border-radius:999px}
    .distribution{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#dfe1e6;margin:0 2px 18px}
    .distribution span{min-width:0;transition:width .25s ease}
    .distribution span:nth-child(1){background:#303036}
    .distribution span:nth-child(2){background:#6a6b72}
    .distribution span:nth-child(3){background:#a1a2a8}
    .distribution span:nth-child(4){background:#cacbd0}
    .distribution span:nth-child(n+5){background:#e1e2e5}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 22px}
    .action{border:0;border-radius:18px;padding:15px;background:var(--card);font-weight:800;box-shadow:var(--shadow)}
    .action.primary{background:#111;color:#fff}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 5px 10px}
    .section-title{font-size:17px;color:var(--muted);font-weight:750}
    .textbtn{border:0;background:transparent;font-weight:800;color:#111;padding:8px}
    .list{display:grid;gap:10px}
    .pocket{width:100%;border:0;text-align:left;background:var(--card);border-radius:22px;padding:17px 18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center}
    .pocket-emoji{width:46px;height:46px;border-radius:15px;background:var(--chip);display:grid;place-items:center;font-size:23px}
    .pocket-name{font-weight:850;font-size:17px}
    .pocket-meta{color:var(--muted);font-size:12px;margin-top:4px}
    .pocket-value{text-align:right;font-weight:850;font-size:18px}
    .smallbtn{border:0;background:var(--chip);border-radius:12px;padding:9px 11px;font-weight:800}
    .empty{background:var(--card);border-radius:22px;padding:28px;text-align:center;color:var(--muted)}
    .history-tools{display:flex;gap:8px;margin:0 0 14px;overflow:auto}
    .filterbtn{border:0;background:var(--card);border-radius:999px;padding:10px 14px;font-weight:750;white-space:nowrap}
    .filterbtn.active{background:#111;color:#fff}
    .history-row{background:var(--card);border-radius:18px;padding:15px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;box-shadow:var(--shadow)}
    .history-title{font-weight:800}
    .history-meta{color:var(--muted);font-size:12px;margin-top:4px}
    .amount.plus{color:var(--good);font-weight:850}.amount.minus{color:var(--bad);font-weight:850}
    .settings-card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
    .settings-card h3{margin:0 0 12px;font-size:17px}
    .settings-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
    .settings-row:last-child{border-bottom:0}
    .settings-row input{width:82px;padding:9px;border:1px solid var(--line);border-radius:12px;text-align:right;background:#fff}
    .alloc-total{font-size:13px;font-weight:800;margin-top:12px}
    .alloc-total.ok{color:var(--good)} .alloc-total.bad{color:var(--bad)}
    .danger{color:var(--bad)}
    .version{color:var(--muted);font-size:12px;text-align:center;margin:20px 0 0}
    .nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(700px,calc(100% - 24px));background:rgba(255,255,255,.94);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(3,1fr);padding:8px;border-radius:24px;box-shadow:0 10px 35px rgba(0,0,0,.14);z-index:20}
    .nav button{border:0;background:transparent;border-radius:17px;padding:11px 4px;font-weight:800;color:#777}
    .nav button.active{background:#111;color:#fff}
    .page{display:none}.page.active{display:block}
    dialog{border:0;border-radius:28px;padding:0;width:min(92vw,520px);box-shadow:0 25px 80px rgba(0,0,0,.25)}
    dialog::backdrop{background:rgba(0,0,0,.38);backdrop-filter:blur(3px)}
    .modal{padding:22px;position:relative}
    .modal-close{position:absolute;right:16px;top:14px;width:42px;height:42px;border:0;border-radius:50%;background:var(--chip);font-size:24px;line-height:1;display:grid;place-items:center}
    .modal h2{padding-right:50px}
    .salary-alloc-list{display:grid;gap:8px;margin:12px 0}
    .salary-alloc-row{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;background:var(--chip);border-radius:14px;padding:10px 12px}
    .salary-alloc-row input{width:100%;border:1px solid var(--line);background:#fff;padding:10px;border-radius:12px;text-align:right}
    .salary-alloc-total{font-size:13px;font-weight:800;margin-top:8px}
    .salary-alloc-total.ok{color:var(--good)}
    .salary-alloc-total.bad{color:var(--bad)}
    .modal h2{margin:0 0 18px;font-size:24px;padding-right:50px}
    .field{display:grid;gap:7px;margin:12px 0}
    .field label{font-size:13px;color:var(--muted);font-weight:750}
    .field input,.field select{width:100%;border:1px solid var(--line);background:white;padding:13px 14px;border-radius:14px;outline:none}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .modal-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}
    .modal-actions button{border:0;border-radius:15px;padding:14px;min-height:48px;font-weight:850}
    .save{background:#111;color:white}
    .modal-danger{width:100%;margin-top:10px;border:0;border-radius:15px;padding:12px;font-weight:800;background:#fff0ef;color:var(--bad)}
    .hint{font-size:12px;color:var(--muted);line-height:1.55}
    .preview-list{display:grid;gap:5px;margin-top:8px}
    .toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111;color:white;border-radius:999px;padding:10px 15px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:420px){h1{font-size:34px}.summary .value{font-size:32px}.pocket{grid-template-columns:auto 1fr}.pocket-value{grid-column:2;text-align:left}}
  </style>
</head>
<body>
<main class="app">
  <section id="homePage" class="page active">
    <div class="topbar"><h1>VAULT</h1><button class="iconbtn" id="quickAddBtn" aria-label="取引を追加">＋</button></div>
    <div class="summary">
      <div class="label">合計残高</div>
      <div class="value" id="totalBalance">¥0</div>
      <div class="sub"><span class="chip" id="monthIn">今月の入金 ¥0</span><span class="chip" id="monthOut">今月の支出 ¥0</span></div>
    </div>
    <div class="distribution" id="distribution" aria-label="残高の割合"></div>
    <div class="actions">
      <button class="action primary" id="salaryBtn">給料を振り分け</button>
      <button class="action" id="transferBtn">箱どうしで移動</button>
    </div>
    <div class="section-head"><div class="section-title">用途別の残高</div><button class="textbtn" id="addPocketBtn">＋ 箱を追加</button></div>
    <div id="pocketList" class="list"></div>
  </section>

  <section id="historyPage" class="page">
    <div class="topbar"><h1>履歴</h1><button class="iconbtn" id="historyAddBtn">＋</button></div>
    <div class="history-tools">
      <button class="filterbtn active" data-filter="all">すべて</button>
      <button class="filterbtn" data-filter="income">入金</button>
      <button class="filterbtn" data-filter="expense">支出</button>
    </div>
    <div id="historyList" class="list"></div>
  </section>

  <section id="settingsPage" class="page">
    <div class="topbar"><h1>設定</h1><span></span></div>
    <div class="settings-card">
      <h3>給料の自動振り分け</h3>
      <div id="allocationSettings"></div>
      <div id="allocationTotal" class="alloc-total"></div>
      <p class="hint">合計100%なら「給料を振り分け」が使えます。残高は月が変わってもそのまま持ち越します。</p>
    </div>
    <div class="settings-card">
      <h3>お金箱</h3>
      <div class="settings-row"><span>新しい箱を追加</span><button class="smallbtn" id="settingsAddPocketBtn">追加</button></div>
      <p class="hint">ホーム画面の箱をタップすると、名前・絵文字・振り分け率を変更できます。</p>
    </div>
    <div class="settings-card">
      <h3>データ</h3>
      <div class="settings-row"><span>バックアップを書き出す</span><button class="smallbtn" id="exportBtn">書き出し</button></div>
      <div class="settings-row"><span>バックアップを読み込む</span><button class="smallbtn" id="importBtn">読み込む</button></div>
      <input id="importFile" type="file" accept="application/json" hidden>
      <div class="settings-row"><span class="danger">すべてのデータを削除</span><button class="smallbtn danger" id="resetBtn">削除</button></div>
    </div>
    <div class="version">VAULT v2.3</div>
  </section>
</main>

<nav class="nav">
  <button data-page="homePage" class="active">残高</button>
  <button data-page="historyPage">履歴</button>
  <button data-page="settingsPage">設定</button>
</nav>

<dialog id="transactionDialog"><form method="dialog" class="modal" id="transactionForm">
  <button type="button" class="modal-close" data-close-dialog="transactionDialog" aria-label="閉じる">×</button>
  <h2>取引を追加</h2>
  <div class="row2">
    <div class="field"><label>種類</label><select id="txType"><option value="expense">支出</option><option value="income">入金</option></select></div>
    <div class="field"><label>お金箱</label><select id="txPocket"></select></div>
  </div>
  <div class="field"><label>金額</label><input id="txAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="3000" required></div>
  <div class="field"><label>メモ</label><input id="txMemo" maxlength="40" placeholder="ゲーム、プレゼントなど"></div>
  <div class="modal-actions"><button class="save" id="txSaveBtn" value="default">保存</button></div>
</form></dialog>

<dialog id="salaryDialog"><form method="dialog" class="modal" id="salaryForm">
  <button type="button" class="modal-close" data-close-dialog="salaryDialog" aria-label="閉じる">×</button>
  <h2>給料を振り分け</h2>
  <div class="field"><label>今回の給料</label><input id="salaryAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="60000" required></div>
  <div class="field">
    <label>自動振り分けの中身</label>
    <div id="salaryAllocationEditor" class="salary-alloc-list"></div>
    <div id="salaryAllocationTotal" class="salary-alloc-total"></div>
    <div class="hint">ここで割合を変えると、その設定を保存して次回以降にも使います。</div>
  </div>
  <div id="salaryPreview" class="hint"></div>
  <div class="modal-actions"><button class="save" id="salarySaveBtn" value="default">振り分ける</button></div>
</form></dialog>

<dialog id="transferDialog"><form method="dialog" class="modal" id="transferForm">
  <button type="button" class="modal-close" data-close-dialog="transferDialog" aria-label="閉じる">×</button>
  <h2>箱どうしで移動</h2>
  <div class="row2">
    <div class="field"><label>移動元</label><select id="fromPocket"></select></div>
    <div class="field"><label>移動先</label><select id="toPocket"></select></div>
  </div>
  <div class="field"><label>金額</label><input id="transferAmount" type="number" min="1" step="1" inputmode="numeric" required></div>
  <div class="modal-actions"><button class="save" id="transferSaveBtn" value="default">移動する</button></div>
</form></dialog>

<dialog id="pocketDialog"><form method="dialog" class="modal" id="pocketForm">
  <button type="button" class="modal-close" data-close-dialog="pocketDialog" aria-label="閉じる">×</button>
  <h2 id="pocketDialogTitle">お金箱を追加</h2>
  <input id="editPocketId" type="hidden">
  <div class="row2">
    <div class="field"><label>絵文字</label><input id="pocketEmoji" maxlength="4" value="💰" placeholder="🎮"></div>
    <div class="field"><label>給料の振り分け率</label><input id="pocketAllocation" type="number" min="0" max="100" step="1" value="0"></div>
  </div>
  <div class="field"><label>名前</label><input id="pocketName" maxlength="20" placeholder="旅行" required></div>
  <div class="modal-actions"><button class="save" id="pocketSaveBtn" value="default">保存</button></div>
  <button type="button" class="modal-danger" id="pocketDeleteBtn" hidden>この箱を削除</button>
</form></dialog>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY="moneybox-v1";
const DEFAULT={
  pockets:[
    {id:"hobby",name:"趣味",emoji:"🎮",balance:0,allocation:25},
    {id:"family",name:"親孝行",emoji:"🎁",balance:0,allocation:10},
    {id:"saving",name:"貯金",emoji:"🏦",balance:0,allocation:65},
    {id:"invest",name:"投資資金",emoji:"📈",balance:0,allocation:0}
  ],
  transactions:[],
  settings:{lastSalary:0}
};
let data=load(), historyFilter="all";

function clone(x){return JSON.parse(JSON.stringify(x))}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2))}
function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return clone(DEFAULT);
    const d=JSON.parse(raw);
    if(!Array.isArray(d.pockets)||!Array.isArray(d.transactions))return clone(DEFAULT);
    d.settings=d.settings||{lastSalary:0};
    d.pockets.forEach(p=>{if(typeof p.allocation!=="number")p.allocation=0;if(typeof p.balance!=="number")p.balance=0});
    return d;
  }catch{return clone(DEFAULT)}
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));render()}
function yen(n){return new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(Math.round(Number(n)||0))}
function nowISO(){return new Date().toISOString()}
function monthKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function getPocket(id){return data.pockets.find(p=>p.id===id)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}
function allocationTotal(){return data.pockets.reduce((s,p)=>s+(Number(p.allocation)||0),0)}

function render(){
  const total=data.pockets.reduce((s,p)=>s+p.balance,0);
  document.getElementById("totalBalance").textContent=yen(total);
  const mk=monthKey(), monthTx=data.transactions.filter(t=>monthKey(new Date(t.date))===mk);
  const inc=monthTx.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const out=monthTx.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  document.getElementById("monthIn").textContent="今月の入金 "+yen(inc);
  document.getElementById("monthOut").textContent="今月の支出 "+yen(out);

  const dist=document.getElementById("distribution");dist.innerHTML="";
  const positiveTotal=data.pockets.reduce((s,p)=>s+Math.max(0,p.balance),0);
  data.pockets.forEach(p=>{
    const s=document.createElement("span");
    s.style.width=(positiveTotal?Math.max(0,p.balance)/positiveTotal*100:0)+"%";
    s.title=p.name+" "+yen(p.balance);
    dist.appendChild(s);
  });

  const list=document.getElementById("pocketList");list.innerHTML="";
  if(!data.pockets.length)list.innerHTML='<div class="empty">お金箱を追加してください</div>';
  data.pockets.forEach(p=>{
    const el=document.createElement("button");el.className="pocket";el.type="button";
    el.innerHTML=`<div class="pocket-emoji">${escapeHtml(p.emoji||"💰")}</div>
      <div><div class="pocket-name">${escapeHtml(p.name)}</div><div class="pocket-meta">給料の ${p.allocation}% ・ タップで編集</div></div>
      <div class="pocket-value">${yen(p.balance)}</div>`;
    el.addEventListener("click",()=>openPocketEditor(p.id));
    list.appendChild(el);
  });

  renderHistory();
  renderSelects();
  renderAllocation();
}

function renderHistory(){
  const hist=document.getElementById("historyList");hist.innerHTML="";
  let txs=[...data.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(historyFilter!=="all")txs=txs.filter(t=>t.type===historyFilter);
  if(!txs.length){hist.innerHTML='<div class="empty">該当する履歴はありません</div>';return}
  txs.forEach(t=>{
    const p=getPocket(t.pocketId), sign=t.type==="income"?"+":"−";
    const row=document.createElement("div");row.className="history-row";
    row.innerHTML=`<div><div class="history-title">${escapeHtml(t.memo||(t.type==="income"?"入金":"支出"))}</div>
      <div class="history-meta">${p?escapeHtml(p.name):(t.pocketName?escapeHtml(t.pocketName):"削除済み")} ・ ${new Date(t.date).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</div></div>
      <div class="amount ${t.type==="income"?"plus":"minus"}">${sign}${yen(t.amount)}</div>`;
    hist.appendChild(row);
  });
}

function renderSelects(){
  ["txPocket","fromPocket","toPocket"].forEach(id=>{
    const s=document.getElementById(id), old=s.value;s.innerHTML="";
    data.pockets.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=`${p.emoji||"💰"} ${p.name}`;s.appendChild(o)});
    if([...s.options].some(o=>o.value===old))s.value=old;
  });
}
function renderAllocation(){
  const c=document.getElementById("allocationSettings");c.innerHTML="";
  data.pockets.forEach(p=>{
    const row=document.createElement("div");row.className="settings-row";
    row.innerHTML=`<span>${escapeHtml(p.emoji||"💰")} ${escapeHtml(p.name)}</span><span><input type="number" min="0" max="100" value="${p.allocation}" data-alloc="${p.id}"> %</span>`;
    c.appendChild(row);
  });
  c.querySelectorAll("input").forEach(inp=>inp.addEventListener("change",e=>{
    const p=getPocket(e.target.dataset.alloc);if(!p)return;
    p.allocation=Math.max(0,Math.min(100,Math.round(Number(e.target.value)||0)));save();
  }));
  const total=allocationTotal(), el=document.getElementById("allocationTotal");
  el.textContent=`現在の合計：${total}%`;
  el.className="alloc-total "+(total===100?"ok":"bad");
}


function getOpenDialog(){
  return [...document.querySelectorAll("dialog")].find(d=>d.open)||null;
}

function openAppDialog(dialog){
  if(!dialog || dialog.open)return;
  dialog.showModal();
}

function closeAppDialog(dialog){
  if(!dialog || !dialog.open)return;
  dialog.close();
}

document.querySelectorAll("[data-close-dialog]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const dialog=document.getElementById(btn.dataset.closeDialog);
    closeAppDialog(dialog);
  });
});

document.querySelectorAll("dialog").forEach(dialog=>{
  dialog.addEventListener("cancel",e=>{
    e.preventDefault();
    closeAppDialog(dialog);
  });
  dialog.addEventListener("click",e=>{
    if(e.target===dialog) closeAppDialog(dialog);
  });
});

function showPage(pageId){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===pageId));
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===pageId));
}

document.querySelectorAll(".nav button").forEach(btn=>btn.addEventListener("click",()=>{
  showPage(btn.dataset.page);
}));

document.querySelectorAll(".filterbtn").forEach(btn=>btn.addEventListener("click",()=>{
  historyFilter=btn.dataset.filter;
  document.querySelectorAll(".filterbtn").forEach(b=>b.classList.toggle("active",b===btn));
  renderHistory();
}));

const txDialog=document.getElementById("transactionDialog");
function openTransaction(){if(!data.pockets.length){showToast("先にお金箱を追加してください");return}openAppDialog(txDialog)}
document.getElementById("quickAddBtn").onclick=openTransaction;
document.getElementById("historyAddBtn").onclick=openTransaction;
document.getElementById("txSaveBtn").onclick=e=>{
  e.preventDefault();
  const type=document.getElementById("txType").value,pid=document.getElementById("txPocket").value;
  const amount=Math.round(Number(document.getElementById("txAmount").value)),memo=document.getElementById("txMemo").value.trim(),p=getPocket(pid);
  if(!p||!amount||amount<=0)return;
  if(type==="expense"&&p.balance<amount&&!confirm("このお金箱の残高を超えます。続けますか？"))return;
  p.balance+=type==="income"?amount:-amount;
  data.transactions.push({id:uid(),type,pocketId:pid,pocketName:p.name,amount,memo,date:nowISO()});
  save();closeAppDialog(txDialog);document.getElementById("transactionForm").reset();showToast("保存しました");
};

const salaryDialog=document.getElementById("salaryDialog");

function renderSalaryAllocationEditor(){
  const box=document.getElementById("salaryAllocationEditor");
  box.innerHTML="";
  data.pockets.forEach(p=>{
    const row=document.createElement("div");
    row.className="salary-alloc-row";
    row.innerHTML=`<span>${escapeHtml(p.emoji||"💰")} ${escapeHtml(p.name)}</span>
      <label><input type="number" min="0" max="100" step="1" value="${p.allocation}" data-salary-alloc="${p.id}" inputmode="numeric"> %</label>`;
    box.appendChild(row);
  });
  box.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("input",()=>{
      inp.value=Math.max(0,Math.min(100,Math.round(Number(inp.value)||0)));
      updateSalaryPreview();
    });
  });
  updateSalaryPreview();
}

function getSalaryEditorAllocation(){
  const result={};
  document.querySelectorAll("[data-salary-alloc]").forEach(inp=>{
    result[inp.dataset.salaryAlloc]=Math.max(0,Math.min(100,Math.round(Number(inp.value)||0)));
  });
  return result;
}

document.getElementById("salaryBtn").onclick=()=>{
  if(!data.pockets.length){showToast("先にお金箱を追加してください");return}
  document.getElementById("salaryAmount").value=data.settings.lastSalary||"";
  renderSalaryAllocationEditor();
  openAppDialog(salaryDialog);
};
document.getElementById("salaryAmount").oninput=updateSalaryPreview;

function updateSalaryPreview(){
  const amount=Math.round(Number(document.getElementById("salaryAmount").value)||0);
  const alloc=getSalaryEditorAllocation();
  const total=Object.values(alloc).reduce((s,n)=>s+n,0);
  const totalEl=document.getElementById("salaryAllocationTotal");
  totalEl.textContent=`現在の合計：${total}%`;
  totalEl.className="salary-alloc-total "+(total===100?"ok":"bad");
  const lines=data.pockets.filter(p=>(alloc[p.id]||0)>0).map(p=>`${p.emoji||"💰"} ${escapeHtml(p.name)}：${yen(amount*(alloc[p.id]||0)/100)}`);
  document.getElementById("salaryPreview").innerHTML=`<div class="preview-list">${lines.join("<br>")}</div>`;
}

document.getElementById("salarySaveBtn").onclick=e=>{
  e.preventDefault();
  const amount=Math.round(Number(document.getElementById("salaryAmount").value));
  if(!amount||amount<=0)return;
  const alloc=getSalaryEditorAllocation();
  const total=Object.values(alloc).reduce((s,n)=>s+n,0);
  if(total!==100){alert("振り分け割合の合計を100%にしてください。");return}

  data.pockets.forEach(p=>{p.allocation=alloc[p.id]||0});
  let assigned=0;
  const targets=data.pockets.filter(p=>p.allocation>0);
  targets.forEach((p,i)=>{
    const part=i===targets.length-1?amount-assigned:Math.round(amount*p.allocation/100);
    assigned+=part;
    p.balance+=part;
    data.transactions.push({id:uid(),type:"income",pocketId:p.id,pocketName:p.name,amount:part,memo:"給料の振り分け",date:nowISO()});
  });
  data.settings.lastSalary=amount;
  save();
  closeAppDialog(salaryDialog);
  showToast("給料を振り分けました");
};

const transferDialog=document.getElementById("transferDialog");
document.getElementById("transferBtn").onclick=()=>{if(data.pockets.length<2){showToast("お金箱が2つ以上必要です");return}openAppDialog(transferDialog)};
document.getElementById("transferSaveBtn").onclick=e=>{
  e.preventDefault();
  const from=document.getElementById("fromPocket").value,to=document.getElementById("toPocket").value,amount=Math.round(Number(document.getElementById("transferAmount").value));
  if(from===to){alert("移動元と移動先を変えてください。");return}
  if(!amount||amount<=0)return;
  const a=getPocket(from),b=getPocket(to);if(!a||!b)return;
  if(a.balance<amount&&!confirm("移動元の残高を超えます。続けますか？"))return;
  a.balance-=amount;b.balance+=amount;const d=nowISO();
  data.transactions.push({id:uid(),type:"expense",pocketId:a.id,pocketName:a.name,amount,memo:`${b.name}へ移動`,date:d});
  data.transactions.push({id:uid(),type:"income",pocketId:b.id,pocketName:b.name,amount,memo:`${a.name}から移動`,date:d});
  save();closeAppDialog(transferDialog);document.getElementById("transferForm").reset();showToast("移動しました");
};

const pocketDialog=document.getElementById("pocketDialog");
function openNewPocket(){
  document.getElementById("pocketDialogTitle").textContent="お金箱を追加";
  document.getElementById("editPocketId").value="";
  document.getElementById("pocketEmoji").value="💰";
  document.getElementById("pocketName").value="";
  document.getElementById("pocketAllocation").value="0";
  document.getElementById("pocketDeleteBtn").hidden=true;
  openAppDialog(pocketDialog);
}
function openPocketEditor(id){
  const p=getPocket(id);if(!p)return;
  document.getElementById("pocketDialogTitle").textContent="お金箱を編集";
  document.getElementById("editPocketId").value=p.id;
  document.getElementById("pocketEmoji").value=p.emoji||"💰";
  document.getElementById("pocketName").value=p.name;
  document.getElementById("pocketAllocation").value=p.allocation;
  document.getElementById("pocketDeleteBtn").hidden=false;
  openAppDialog(pocketDialog);
}
document.getElementById("addPocketBtn").onclick=openNewPocket;
document.getElementById("settingsAddPocketBtn").onclick=openNewPocket;
document.getElementById("pocketSaveBtn").onclick=e=>{
  e.preventDefault();
  const id=document.getElementById("editPocketId").value,name=document.getElementById("pocketName").value.trim();
  const emoji=document.getElementById("pocketEmoji").value.trim()||"💰";
  const allocation=Math.max(0,Math.min(100,Math.round(Number(document.getElementById("pocketAllocation").value)||0)));
  if(!name)return;
  if(id){
    const p=getPocket(id);if(!p)return;p.name=name;p.emoji=emoji;p.allocation=allocation;
  }else data.pockets.push({id:uid(),name,emoji,balance:0,allocation});
  save();closeAppDialog(pocketDialog);showToast(id?"変更しました":"追加しました");
};
document.getElementById("pocketDeleteBtn").onclick=()=>{
  const id=document.getElementById("editPocketId").value,p=getPocket(id);if(!p)return;
  if(p.balance!==0){alert("残高が0円の箱だけ削除できます。先に別の箱へ移動してください。");return}
  if(!confirm(`「${p.name}」を削除しますか？`))return;
  data.pockets=data.pockets.filter(x=>x.id!==id);
  save();closeAppDialog(pocketDialog);showToast("削除しました");
};

document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="moneybox-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    const obj=JSON.parse(await file.text());
    if(!Array.isArray(obj.pockets)||!Array.isArray(obj.transactions))throw new Error();
    obj.settings=obj.settings||{lastSalary:0};data=obj;save();showToast("読み込みました");
  }catch{alert("バックアップファイルを読み込めませんでした。")}
  e.target.value="";
};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("残高と履歴をすべて削除して初期状態に戻しますか？")){data=clone(DEFAULT);save();showToast("初期状態に戻しました")}
};

if("serviceWorker" in navigator&&location.protocol!=="file:"){
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("./sw.js");
      reg.update();
    }catch{}
  });
}
render();
</script>
</body>
